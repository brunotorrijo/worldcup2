<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Join a World Cup 2026 prediction league with your invite code.">
  <title>Join League — WC26 Prediction League</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="nav" id="main-nav"></nav>

  <main class="page-content">
    <div class="container-sm" style="padding-top: 3rem;">
      <div class="card fade-in">
        <div class="text-center mb-3">
          <h1 style="font-size: 1.5rem;">🎟️ Join a League</h1>
          <p class="text-muted mt-1" style="font-size: 0.9rem;">Enter the invite code shared by your league creator</p>
        </div>

        <div id="league-preview" class="hidden" style="text-align: center; margin-bottom: 1.5rem;">
          <span class="badge badge-gold" id="league-name-badge"></span>
        </div>

        <form id="join-form">
          <div class="form-group">
            <label class="form-label" for="join-code">Invite Code</label>
            <input type="text" class="form-input" id="join-code" placeholder="e.g. A1B2C3" maxlength="6" required style="text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; text-align: center; font-size: 1.2rem;">
          </div>
          <div class="form-group">
            <label class="form-label" for="join-name">Your Display Name</label>
            <input type="text" class="form-input" id="join-name" placeholder="How your friends will see you" maxlength="30" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="join-submit">Join League</button>
        </form>
      </div>
    </div>
  </main>

  <script src="/js/app.js"></script>
  <script src="/js/join.js"></script>
</body>
</html>
